[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledgeops"
version = "0.1.0"
description = "Audit, govern, and improve knowledge workspaces"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
