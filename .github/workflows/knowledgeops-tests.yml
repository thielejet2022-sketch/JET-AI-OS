name: KnowledgeOps Tests

on:
  push:
    paths:
      - "knowledgeops/**"
      - ".github/workflows/knowledgeops-tests.yml"
  pull_request:
    paths:
      - "knowledgeops/**"
      - ".github/workflows/knowledgeops-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledgeops

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: knowledgeops/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
